[package]
name = "ytrust-node"
version = "0.1.3"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.16.2", features = ["napi10", "tokio_rt"] }
napi-derive = "3.7.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
ytrust = { path = ".." }

[build-dependencies]
napi-build = "2.6.0"
