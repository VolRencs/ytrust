[package]
name = "ytrust"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "Fast, modern YouTube downloader"
repository = "https://github.com/VolRencs/ytrust"
readme = "README.md"
license = "GPL-3.0-only"
publish = false

[workspace]
members = ["node"]
resolver = "3"

[dependencies]
aes = "0.9.4"
cbc = "0.2.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
futures-util = "0.3.34"
indicatif = "0.18.6"
pbkdf2 = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls", "gzip", "brotli", "deflate", "json", "socks", "http2", "charset"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The native Node addon must unwind Rust panics so napi-rs can turn them into
# JavaScript errors instead of aborting the whole host process.
[profile.napi]
inherits = "release"
panic = "unwind"
