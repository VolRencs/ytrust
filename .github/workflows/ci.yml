name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  node:
    name: Node module (Node 26.x)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: node-addon-ubuntu-22.04

      - name: Install dependencies
        working-directory: node
        run: pnpm install --frozen-lockfile

      - name: Build native addon
        working-directory: node
        run: pnpm build

      - name: Smoke-load native addon
        working-directory: node
        run: |
          file ytrust.linux-x64-gnu.node
          node -e 'const { version } = require("./native.cjs"); console.log("native addon", version())'

      - name: Typecheck
        working-directory: node
        run: pnpm typecheck

      - name: Lint
        working-directory: node
        run: pnpm lint

      - name: Node tests
        working-directory: node
        run: pnpm test

      - name: Pack npm module
        working-directory: node
        run: pnpm pack --pack-destination dist

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked
