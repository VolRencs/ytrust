name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          node_version="$(sed -n 's/^version = "\(.*\)"/\1/p' node/Cargo.toml | head -n1)"
          package_version="$(sed -n 's/^  "version": "\(.*\)",/\1/p' node/package.json | head -n1)"
          echo "tag=${tag#v} crate=${version} node=${node_version} npm=${package_version}"
          test "${tag#v}" = "${version}"
          test "${tag#v}" = "${node_version}"
          test "${tag#v}" = "${package_version}"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit
        run: cargo audit

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  build:
    name: build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p ytrust --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          mkdir -p dist
          binary="target/${{ matrix.target }}/release/ytrust"
          chmod +x "$binary"
          tar -czf "dist/ytrust-${tag}-${{ matrix.target }}.tar.gz" \
            -C "$GITHUB_WORKSPACE" LICENSE \
            -C "$(dirname "$binary")" ytrust

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "$env:GITHUB_REF_NAME" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/ytrust.exe", "LICENSE" `
            -DestinationPath "dist/ytrust-${tag}-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  node:
    name: Node package
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: node-release-ubuntu-22.04

      - name: Install dependencies
        working-directory: node
        run: pnpm install --frozen-lockfile

      - name: Audit npm dependencies
        working-directory: node
        run: pnpm audit --audit-level=high

      - name: Build native addon
        working-directory: node
        run: pnpm build

      - name: Smoke-load native addon
        working-directory: node
        run: |
          file ytrust.linux-x64-gnu.node
          node -e 'const { version } = require("./native.cjs"); console.log("native addon", version())'

      - name: Typecheck
        working-directory: node
        run: pnpm typecheck

      - name: Lint
        working-directory: node
        run: pnpm lint

      - name: Node tests
        working-directory: node
        run: pnpm test

      - name: Pack npm module
        working-directory: node
        run: pnpm pack --pack-destination dist

      - uses: actions/upload-artifact@v7
        with:
          name: node-package
          path: node/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [build, node]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Resolve target commit
        id: target
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          target_commitish: ${{ steps.target.outputs.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
